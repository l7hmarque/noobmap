[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noobmap"
version = "0.2.0"
description = "Varredura de seguranca guiada para redes de clientes (Kali Live)"
requires-python = ">=3.9"

[project.scripts]
noobmap = "noobmap.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["noobmap"]
